		<!-- SMUI Styles: outrun night (dark) is the default. Sunset day mode is picked with the
		     toggle in the header and remembered; this applies it before the page draws. -->
		<link rel="stylesheet" href="/smui-dark.css" />
		<script>
			try {
				if (localStorage.getItem('theme') === 'day') {
					document.documentElement.dataset.theme = 'day';
					document.write('<link rel="stylesheet" id="theme" href="/smui.css" />');
				}
			} catch (e) {}
		</script>
